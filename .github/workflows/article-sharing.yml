name: article-sharing

on:
  workflow_run:
    workflows: [CI/CD]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: article-sharing-production
  cancel-in-progress: false

jobs:
  release:
    if: vars.WESTERN_DEVS_ENABLED == 'true' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    name: Confirm production publication
    outputs:
      eligible: ${{ steps.release.outputs.eligible }}
      source-sha: ${{ steps.release.outputs.source-sha }}
      source-run-id: ${{ steps.release.outputs.source-run-id }}
      artifact-id: ${{ steps.release.outputs.artifact-id }}
    steps:
      - name: Checkout trusted workflow code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check publishing jobs and select their site artifact
        id: release
        uses: actions/github-script@v9
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { selectSharingRelease } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/lib/article-sharing.js`).href);
            const config = require(`${process.env.GITHUB_WORKSPACE}/config/western-devs.json`);
            const release = await selectSharingRelease({ github, context, repository: config.sourceRepository });
            core.setOutput('eligible', String(release.eligible));
            if (release.eligible) {
              core.setOutput('source-sha', release.commit);
              core.setOutput('source-run-id', String(release.runId));
              core.setOutput('artifact-id', String(release.artifactId));
              await core.summary.addHeading('Article sharing').addRaw(`Source publishing run: ${release.runId}; commit: ${release.commit}`).write();
            } else {
              await core.summary.addHeading('Article sharing skipped').addRaw(release.reason).write();
            }

  western-devs:
    needs: release
    if: needs.release.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Share new articles with Western Devs
    steps:
      - name: Checkout the exact published source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          runtime: node@26
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Download the original publishing run's site artifact
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.release.outputs.artifact-id }}
          run-id: ${{ needs.release.outputs.source-run-id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: _site
      - name: Require Western Devs personal access token
        env:
          WESTERN_DEVS_TOKEN: ${{ secrets.WESTERN_DEVS_TOKEN }}
        run: |
          test -n "$WESTERN_DEVS_TOKEN" || { echo "::error::Set the WESTERN_DEVS_TOKEN repository secret to a personal access token with access to Western Devs."; exit 1; }
      - name: Read Western Devs publication history
        uses: actions/checkout@v6
        with:
          repository: westerndevs/western-devs-website
          ref: master
          path: .cache/western-devs-target
          fetch-depth: 0
          token: ${{ secrets.WESTERN_DEVS_TOKEN }}
          persist-credentials: false
      - name: Verify the source release and share new articles
        run: pnpm crosspost:western-devs publish
        env:
          WESTERN_DEVS_ENABLED: ${{ vars.WESTERN_DEVS_ENABLED }}
          WESTERN_DEVS_TOKEN: ${{ secrets.WESTERN_DEVS_TOKEN }}
          SHARING_RELEASE_READY: ${{ needs.release.outputs.eligible }}
      - name: Preserve sharing results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: western-devs-report
          path: .cache/western-devs/report.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 90
