name: CI/CD

on:
  push:
    branches:
      - main
      - ft/*
      - hf/*
      - v11
      - "!post/**"
    paths-ignore:
      - "_archive/**"
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths-ignore:
      - "_archive/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-static-web-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and test (Node 26)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get UTC cache date
        id: cache-date
        shell: bash
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore IGDB cache
        uses: actions/cache@v6
        with:
          path: .cache/igdb
          key: igdb-v1-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            igdb-v1-

      - name: Build and test
        run: pnpm test
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site/
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v7
        with:
          name: site
          path: _site

      - name: Install OIDC client
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get ID token
        uses: actions/github-script@v9
        id: idtoken
        with:
          script: |
            return await core.getIDToken();
          result-encoding: string

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_SMOKE_09B0C160F }}
          action: upload
          app_location: _site
          api_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
