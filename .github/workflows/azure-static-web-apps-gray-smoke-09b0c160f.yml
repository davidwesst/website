name: CI/CD

on:
  push:
    branches:
      - main
      - ft/*
      - hf/*
      - v11
      - "!post/**"
    paths-ignore:
      - "_archive/**"
      - "docs/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - codex/**
    paths-ignore:
      - "_archive/**"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-static-web-apps-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    name: Build and test (Node 26)
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: false

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@26
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get UTC cache date
        id: cache-date
        shell: bash
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Restore IGDB cache
        uses: actions/cache@v6
        with:
          path: .cache/igdb
          key: igdb-v1-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            igdb-v1-

      - name: Build and test
        run: pnpm test
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}

      - name: Verify local hosting before upload
        run: pnpm check:hosting:local
        env:
          EXPECT_TELEMETRY: ${{ github.ref_name == 'main' }}

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site/
          if-no-files-found: error
          retention-days: 14

      - name: Locate saved IndexNow state before production deployment
        id: indexnow-state
        if: github.event_name == 'push' && github.ref_name == 'main'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const restore = require('./tools/restore-indexnow-state.cjs');
            await restore({ github, context, core });

      - name: Restore saved IndexNow state
        if: github.event_name == 'push' && github.ref_name == 'main' && steps.indexnow-state.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ steps.indexnow-state.outputs.artifact_id }}
          github-token: ${{ github.token }}
          path: .cache/indexnow
          merge-multiple: true

      - name: Preserve pre-deployment IndexNow baseline
        if: github.event_name == 'push' && github.ref_name == 'main'
        continue-on-error: true
        run: node tools/indexnow.mjs prepare

      - name: Upload IndexNow baseline for this release
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: actions/upload-artifact@v7
        with:
          name: indexnow-baseline
          path: .cache/indexnow/state.json
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.event_name == 'push' && github.ref_name == 'main' && vars.HOSTING_PROVIDER != 'cloudflare'
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Azure during migration
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v7
        with:
          name: site
          path: _site

      - name: Install OIDC client
        run: npm install @actions/core@1.6.0 @actions/http-client

      - name: Get ID token
        uses: actions/github-script@v9
        id: idtoken
        with:
          script: |
            return await core.getIDToken();
          result-encoding: string

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GRAY_SMOKE_09B0C160F }}
          action: upload
          app_location: _site
          api_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}

  deploy-cloudflare:
    if: github.event_name == 'push' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && (github.ref_name == 'main' || github.ref_name == 'ft/cloudflare-migration')
    needs: build
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@26
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: site
          path: _site
      - name: Verify downloaded artifact before deployment
        run: pnpm check:hosting:local
        env:
          EXPECT_TELEMETRY: ${{ github.ref_name == 'main' }}
      - name: Deploy verified artifact
        uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.137.0"
          packageManager: pnpm
          command: deploy ${{ github.ref_name != 'main' && '--env staging' || '' }}
      - name: Verify deployed site
        env:
          EXPECT_TELEMETRY: ${{ github.ref_name == 'main' }}
          SITE_URL: ${{ github.ref_name == 'main' && vars.CLOUDFLARE_PRODUCTION_URL || vars.CLOUDFLARE_STAGING_URL }}
        run: node tools/check-hosting.mjs "$SITE_URL" --all-redirects --wait-for-release

  indexnow:
    if: always() && github.event_name == 'push' && github.ref_name == 'main' && (needs.deploy.result == 'success' || needs.deploy-cloudflare.result == 'success')
    needs: [build, deploy, deploy-cloudflare]
    runs-on: ubuntu-latest
    name: Notify IndexNow after verified production deployment
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          runtime: node@26
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: site
          path: _site
      - uses: actions/download-artifact@v7
        with:
          name: indexnow-baseline
          path: .cache/indexnow
      - name: Verify canonical production release
        env:
          EXPECT_TELEMETRY: 'true'
        run: node tools/check-hosting.mjs https://david.wes.st --all-redirects --wait-for-release
      - name: Submit changed URLs
        run: node tools/indexnow.mjs submit
      - name: Preserve acknowledged baseline and pending URLs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: indexnow-state
          path: .cache/indexnow/state.json
          if-no-files-found: warn
          retention-days: 90
